name: Importar vencedores históricos
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar leitor de HTML
        run: python -m pip install beautifulsoup4
      - name: Importar e validar os vencedores
        run: |
          python scripts/atualizar_historico.py --online
          python -m unittest discover -s tests -v
      - name: Publicar CSVs e catálogos no mesmo repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ dados/vencedores.csv dados/pendencias.csv
          if ! git diff --staged --quiet; then
            git commit -m "Atualizar vencedores históricos Oscar e Emmy"
            git push
          else
            echo "Nenhuma alteração a publicar"
          fi
